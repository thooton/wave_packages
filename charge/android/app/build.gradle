plugins {
    id "com.android.application"
}

apply from: rootProject.file("gradle/app.gradle")

// No login is built in: the Tesla refresh token and the regional settings
// are imported on the phone from a setup file (common/ui's Setup), so a
// clean checkout builds with nothing private beside it.

android {
    namespace "com.teslacharge.xp3"

    defaultConfig {
        applicationId "com.teslacharge.xp3"
        versionCode 10
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation project(":common:ui")
}
