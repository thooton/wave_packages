plugins {
    id "com.android.application"
}

apply from: rootProject.file("gradle/app.gradle")

// No login is built in: the Maps key (or a command center that keeps it) is
// imported on the phone from a setup file (common/ui's Setup).

android {
    namespace "com.places.xp3"

    defaultConfig {
        applicationId "com.places.xp3"
        versionCode 20
        versionName "1.7.0"
    }
}

dependencies {
    implementation project(":places:core")
    implementation project(":common:ui")
}
