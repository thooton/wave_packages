plugins {
    id "com.android.application"
}

apply from: rootProject.file("gradle/app.gradle")

// No login is built in: the app is set up on the phone (common/ui's Setup),
// on the phone alone or with a command center that keeps the decks.

android {
    namespace "com.flashcards.xp3"

    defaultConfig {
        applicationId "com.flashcards.xp3"
        versionCode 30
        versionName "1.14.1"
    }
}

dependencies {
    implementation project(":flashcards:core")
    implementation project(":common:ui")
}
