// Wave deliberately ships with the checked-in public Android debug key.
// Both variants use the same certificate for updates. No secrets are needed.
android {
    signingConfigs {
        debug {
            storeFile rootProject.file("signing/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}
