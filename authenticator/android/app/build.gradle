plugins {
    id "com.android.application"
}

apply from: rootProject.file("gradle/app.gradle")

// No login is built in: the app is set up on the phone (common/ui's Setup),
// to keep the accounts on the phone alone or on a command center.

android {
    namespace "com.authenticator.xp3"

    defaultConfig {
        applicationId "com.authenticator.xp3"
        versionCode 10
        versionName "1.2.1"
    }
}

dependencies {
    implementation project(":authenticator:core")
    implementation project(":common:ui")
}
