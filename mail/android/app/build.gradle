plugins {
    id "com.android.application"
}

apply from: rootProject.file("gradle/app.gradle")

// No login is built in: the Gmail login (or a command center that keeps it)
// is imported on the phone from a setup file (common/ui's Setup).

android {
    namespace "com.mail.xp3"

    defaultConfig {
        applicationId "com.mail.xp3"
        versionCode 19
        versionName "1.5.2"
    }
}

dependencies {
    implementation project(":mail:core")
    implementation project(":common:ui")
}
