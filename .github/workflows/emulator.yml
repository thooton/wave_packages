name: XP3 emulator
run-name: XP3 ${{ github.ref_name }}

on:
  push:
    branches: ['emulator/*/start']

permissions:
  contents: write  # Reply on this session's mailbox ref only.

jobs:
  emulator:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: thooton/wave/.github/actions/emulator@1ee0d3b344dbd056a8f6a11c8db32142eddb0b2b
