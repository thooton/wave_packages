name: Dictation x86 parity diagnostic

# Scratch diagnostic for the x86 parity gate. It builds nothing for ARM and publishes nothing.

on:
  push:
    branches: ['feat/dictation-ci-diag*']
    paths:
      - '.github/workflows/dictation-x86-diag.yml'
      - '.github/dictation-diag/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dictation-x86-diag-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_REPO: futo-org/asr4all-s
  HF_COMMIT: 87a6b5d093723fe37e9f69ad26307a3b95a31af0
  PTE_SHA256: 7d5679688ca57a7e42d4b42e093b7a29b85d595f454d41cf0aa5f95e7c8c27ec
  META_SHA256: ef52d88b6ce61f967015e64ec5a9d6b9d5c22a6367c802f1a2a05d5f03b8d1f8
  OPS_SHA256: d445dc9998b33d96f2f63cf493f18bfa112c6e771f487bab83c847698b0398ee
  REF_PY_SHA256: 0918a4dd55806de15943112314c701527e818fc0a3628c4879ba709bbea997af
  FROZEN_GOLDEN_SHA256: 63f177563651a6bb04f804aa34a0dae373667cf59c7e7a763e2d719ff9a1b9c5
  EXECUTORCH_TAG: v1.6.0
  EXECUTORCH_PYPI: '1.6.0'
  TORCH_PYPI: '2.15.0'
  QEMU_CPU_MODEL: Haswell
  DIAG: .github/dictation-diag
  # x86 verification only: drop every XNNPACK kernel family above AVX2/FMA3.
  X86_AVX2_CAP: >-
    -DXNNPACK_ENABLE_AVX512F=OFF -DXNNPACK_ENABLE_AVX512SKX=OFF -DXNNPACK_ENABLE_AVX512VBMI=OFF
    -DXNNPACK_ENABLE_AVX512VNNI=OFF -DXNNPACK_ENABLE_AVX512VNNIGFNI=OFF -DXNNPACK_ENABLE_AVX512AMX=OFF
    -DXNNPACK_ENABLE_AVX512FP16=OFF -DXNNPACK_ENABLE_AVX512BF16=OFF -DXNNPACK_ENABLE_AVX256SKX=OFF
    -DXNNPACK_ENABLE_AVX256VNNI=OFF -DXNNPACK_ENABLE_AVX256VNNIGFNI=OFF -DXNNPACK_ENABLE_AVXVNNI=OFF
    -DXNNPACK_ENABLE_AVXVNNIINT8=OFF

jobs:
  x86-diag:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        # Independent samples of the hosted x86 fleet: results depend on the host CPU class.
        sample: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Host CPU
        run: |
          mkdir -p out_diag
          { lscpu; echo; nproc; echo; grep -m1 '^flags' /proc/cpuinfo; } | tee out_diag/host_cpu.txt
          gcc -O1 -o /tmp/cpuid_probe "$DIAG/cpuid_probe.c"
          /tmp/cpuid_probe | tee out_diag/cpuid_native.txt

      - name: Install build tools, Python reference runtime and qemu-user
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ffmpeg qemu-user
          qemu-x86_64 --version | head -1 | tee out_diag/qemu_version.txt
          python3 -m pip install --upgrade pip
          python3 -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==${TORCH_PYPI}" || true
          python3 -m pip install "executorch==${EXECUTORCH_PYPI}" pyyaml numpy
          python3 -m pip freeze | tee out_diag/pip_freeze.txt

      - name: Download and verify pinned bundle and frozen golden
        run: |
          mkdir -p /tmp/hf_bundle
          base="https://huggingface.co/${HF_REPO}/resolve/${HF_COMMIT}"
          curl -fsSL "$base/executorch/xnnpack_int8/asr_encoder.pte" -o /tmp/hf_bundle/asr_encoder.pte
          curl -fsSL "$base/executorch/xnnpack_int8/metadata.json" -o /tmp/hf_bundle/metadata.json
          curl -fsSL "$base/executorch/xnnpack_int8/ops.txt" -o /tmp/hf_bundle/ops.txt
          curl -fsSL "$base/executorch/asr4all_executorch.py" -o /tmp/hf_bundle/asr4all_executorch.py
          printf "%s  /tmp/hf_bundle/asr_encoder.pte\n%s  /tmp/hf_bundle/metadata.json\n%s  /tmp/hf_bundle/ops.txt\n%s  /tmp/hf_bundle/asr4all_executorch.py\n%s  dictation/native/ops.txt\n%s  $DIAG/frozen_golden_transcripts.json\n" \
            "$PTE_SHA256" "$META_SHA256" "$OPS_SHA256" "$REF_PY_SHA256" "$OPS_SHA256" "$FROZEN_GOLDEN_SHA256" | sha256sum -c -

      - name: Fetch WAV clips and verify PCM against the frozen digests
        run: |
          mkdir -p out_x86/wavs
          python3 dictation/native/scripts/ci_fetch_wavs.py --out-dir out_x86/wavs
          python3 "$DIAG/diag.py" pcm --wav-dir out_x86/wavs \
            --pcm-sha "$DIAG/frozen_wav_pcm_sha256.txt" --file-sha "$DIAG/frozen_wav_file_sha256.txt" \
            | tee out_diag/wav_check.txt

      - name: Validate CPU masking (native, ATEN_CPU_CAPABILITY, qemu)
        run: |
          qemu-x86_64 -cpu help | tee out_diag/qemu_cpu_models.txt | grep -i haswell || true
          {
            echo "native:        $(/tmp/cpuid_probe)"
            echo "qemu $QEMU_CPU_MODEL: $(qemu-x86_64 -cpu "$QEMU_CPU_MODEL" /tmp/cpuid_probe 2>&1)"
            echo "torch native:  $(python3 -c 'import torch; print(torch.backends.cpu.get_cpu_capability())')"
            echo "torch ATEN=avx2: $(ATEN_CPU_CAPABILITY=avx2 python3 -c 'import torch; print(torch.backends.cpu.get_cpu_capability())')"
            echo "torch qemu:    $(qemu-x86_64 -cpu "$QEMU_CPU_MODEL" "$(which python3)" -c 'import torch; print(torch.backends.cpu.get_cpu_capability())' 2>&1 | tail -3)"
            echo "executorch qemu import: $(qemu-x86_64 -cpu "$QEMU_CPU_MODEL" "$(which python3)" -c 'from executorch.runtime import Runtime; print(Runtime.__name__)' 2>&1 | tail -3)"
          } | tee out_diag/cpu_masking.txt

      - name: Python reference, native (unmodified)
        run: |
          mkdir -p out_diag/py_native
          python3 dictation/native/scripts/ci_golden.py --bundle-dir /tmp/hf_bundle \
            --ref-py /tmp/hf_bundle/asr4all_executorch.py --wav-dir out_x86/wavs \
            --golden-out out_diag/py_native/golden_transcripts.json \
            --fixtures-out out_diag/py_native/core_fixtures.json > out_diag/py_native/log.txt 2>&1
          tail -3 out_diag/py_native/log.txt

      - name: Python reference, native with ATEN_CPU_CAPABILITY=avx2 (unmodified)
        env:
          ATEN_CPU_CAPABILITY: avx2
        run: |
          mkdir -p out_diag/py_aten_avx2
          python3 dictation/native/scripts/ci_golden.py --bundle-dir /tmp/hf_bundle \
            --ref-py /tmp/hf_bundle/asr4all_executorch.py --wav-dir out_x86/wavs \
            --golden-out out_diag/py_aten_avx2/golden_transcripts.json \
            --fixtures-out out_diag/py_aten_avx2/core_fixtures.json > out_diag/py_aten_avx2/log.txt 2>&1
          tail -3 out_diag/py_aten_avx2/log.txt

      - name: Checkout ExecuTorch v1.6.0 with required submodules
        run: |
          git clone --depth 1 --branch "${EXECUTORCH_TAG}" https://github.com/pytorch/executorch.git /tmp/et/executorch
          SUBS=(
            backends/xnnpack/third-party/FP16
            backends/xnnpack/third-party/FXdiv
            backends/xnnpack/third-party/XNNPACK
            backends/xnnpack/third-party/cpuinfo
            backends/xnnpack/third-party/pthreadpool
            kernels/optimized/third-party/eigen
            third-party/flatbuffers
            third-party/flatcc
            third-party/gflags
            third-party/json
            third-party/pocketfft
            shim
          )
          git -C /tmp/et/executorch submodule update --init --recursive --depth 1 "${SUBS[@]}" || \
            git -C /tmp/et/executorch submodule update --init --recursive "${SUBS[@]}"
          git -C /tmp/et/executorch/backends/xnnpack/third-party/XNNPACK rev-parse HEAD | tee out_diag/xnnpack_commit.txt

      - name: Build x86_64 asr4all_bench, default (same as build-dictation-runtime.yml)
        run: |
          cmake -S dictation/native -B /tmp/build_default -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DEXECUTORCH_DIR=/tmp/et/executorch \
            -DPYTHON_EXECUTABLE="$(which python3)" > out_diag/cmake_default.txt
          cmake --build /tmp/build_default --target asr4all_bench -j"$(nproc)" > /dev/null
          cp /tmp/build_default/asr4all_bench out_diag/asr4all_bench_x86_64_default
          grep -E '^XNNPACK_ENABLE_(AVX|SSE|FMA|F16C)' /tmp/build_default/CMakeCache.txt | sort | tee out_diag/xnnpack_options_default.txt

      - name: Build x86_64 asr4all_bench, AVX2-capped XNNPACK
        run: |
          # shellcheck disable=SC2086
          cmake -S dictation/native -B /tmp/build_avx2 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DEXECUTORCH_DIR=/tmp/et/executorch \
            -DPYTHON_EXECUTABLE="$(which python3)" $X86_AVX2_CAP > out_diag/cmake_avx2.txt
          cmake --build /tmp/build_avx2 --target asr4all_bench -j"$(nproc)" > /dev/null
          cp /tmp/build_avx2/asr4all_bench out_diag/asr4all_bench_x86_64_avx2
          grep -E '^XNNPACK_ENABLE_(AVX|SSE|FMA|F16C)' /tmp/build_avx2/CMakeCache.txt | sort | tee out_diag/xnnpack_options_avx2.txt
          ! grep -E '^XNNPACK_ENABLE_(AVX512|AVX256|AVXVNNI)[A-Z0-9]*:BOOL=ON' /tmp/build_avx2/CMakeCache.txt

      - name: C++ default build, native, off/copy/resident
        run: |
          python3 "$DIAG/diag.py" bench --label default --bench out_diag/asr4all_bench_x86_64_default \
            --model /tmp/hf_bundle/asr_encoder.pte --meta /tmp/hf_bundle/metadata.json \
            --wav-dir out_x86/wavs --golden "$DIAG/frozen_golden_transcripts.json" \
            --out-dir out_diag/cpp_default --threads "$(nproc)"

      - name: C++ AVX2-capped build, native, off/copy/resident
        run: |
          python3 "$DIAG/diag.py" bench --label avx2 --bench out_diag/asr4all_bench_x86_64_avx2 \
            --model /tmp/hf_bundle/asr_encoder.pte --meta /tmp/hf_bundle/metadata.json \
            --wav-dir out_x86/wavs --golden "$DIAG/frozen_golden_transcripts.json" \
            --out-dir out_diag/cpp_avx2 --threads "$(nproc)"

      - name: Exact gate form, AVX2-capped C++ vs pinned frozen golden (480 checks)
        id: gate_avx2
        continue-on-error: true
        run: |
          python3 dictation/native/scripts/ci_verify_cli.py \
            --bench out_diag/asr4all_bench_x86_64_avx2 \
            --model /tmp/hf_bundle/asr_encoder.pte \
            --meta /tmp/hf_bundle/metadata.json \
            --wav-dir out_x86/wavs \
            --golden "$DIAG/frozen_golden_transcripts.json" \
            --threads "$(nproc)" \
            --feedback-modes off,copy,resident 2>&1 | tee out_diag/gate_avx2_vs_frozen.txt
          test "${PIPESTATUS[0]}" -eq 0

      - name: Cross-check masking, C++ default build under qemu-user (off)
        id: qemu_cpp
        continue-on-error: true
        timeout-minutes: 45
        run: |
          python3 "$DIAG/diag.py" bench --label qemu-default --bench out_diag/asr4all_bench_x86_64_default \
            --model /tmp/hf_bundle/asr_encoder.pte --meta /tmp/hf_bundle/metadata.json \
            --wav-dir out_x86/wavs --golden "$DIAG/frozen_golden_transcripts.json" \
            --out-dir out_diag/cpp_default_qemu --threads "$(nproc)" --modes off \
            --prefix "qemu-x86_64 -cpu $QEMU_CPU_MODEL"

      - name: Python reference under qemu-user (unmodified)
        id: qemu_py
        continue-on-error: true
        timeout-minutes: 60
        run: |
          mkdir -p out_diag/py_qemu
          qemu-x86_64 -cpu "$QEMU_CPU_MODEL" "$(which python3)" dictation/native/scripts/ci_golden.py \
            --bundle-dir /tmp/hf_bundle --ref-py /tmp/hf_bundle/asr4all_executorch.py --wav-dir out_x86/wavs \
            --golden-out out_diag/py_qemu/golden_transcripts.json \
            --fixtures-out out_diag/py_qemu/core_fixtures.json > out_diag/py_qemu/log.txt 2>&1
          tail -3 out_diag/py_qemu/log.txt

      - name: Compare everything against the frozen golden
        if: always()
        run: |
          python3 "$DIAG/diag.py" compare --frozen "$DIAG/frozen_golden_transcripts.json" \
            --python native=out_diag/py_native/golden_transcripts.json \
            --python aten_avx2=out_diag/py_aten_avx2/golden_transcripts.json \
            --python qemu=out_diag/py_qemu/golden_transcripts.json \
            --cpp default=out_diag/cpp_default \
            --cpp avx2=out_diag/cpp_avx2 \
            --cpp qemu_default=out_diag/cpp_default_qemu \
            --out out_diag/compare.txt
          echo "gate_avx2=${{ steps.gate_avx2.outcome }} qemu_cpp=${{ steps.qemu_cpp.outcome }} qemu_py=${{ steps.qemu_py.outcome }}" | tee out_diag/outcomes.txt
          (cd out_diag && find . -type f ! -name sha256sums.txt | sort | sed 's|^\./||' | xargs sha256sum > sha256sums.txt)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dictation-x86-diag-${{ matrix.sample }}
          path: out_diag/
          if-no-files-found: error
