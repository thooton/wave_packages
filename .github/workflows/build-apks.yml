name: Build and publish XP3800 packages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      retry-publish:
        type: boolean
        description: Retry mirroring unchanged packages from their existing releases
        default: false

permissions:
  contents: read

concurrency:
  group: wave-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_BUILD_TOOLS: '35.0.1'

jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.1
      - uses: gradle/actions/setup-gradle@v4
      - name: Release tooling tests
        run: python3 -m unittest discover -s .github -p 'test_release.py'
      - name: Build APKs and legacy manifest with the checked-in keys
        run: .github/build-apks.sh
      - uses: actions/upload-artifact@v4
        with:
          name: all-apks
          path: apks/
          if-no-files-found: error

  build-mods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.1
      - name: Host tests and module packages
        run: |
          mods/tools/setup.sh
          mods/tools/test.sh
          mkdir modules
          for path in $(python3 -c 'import sys; sys.path.insert(0, ".github"); from packages import MODULES; print(*MODULES)'); do
            echo "::group::$path"
            rm -rf "$path/out"
            # What mods/tools/build-module.sh does, for every mod.
            "$path/tools/test.sh"
            "$path/tools/build.sh"
            "$path/tools/package.sh"
            cp "$path"/out/*.zip modules/
            echo "::endgroup::"
          done
          ls -l modules
      - uses: actions/upload-artifact@v4
        with:
          name: mod-zips
          path: modules/*.zip
          if-no-files-found: error

  # One job for every app and mod: an immutable release per new version, the
  # legacy rolling release, then one catalog commit for everything new. A
  # broken mod build holds back the mods, not the apps.
  release:
    needs: [build-apks, build-mods]
    if: >-
      !cancelled() && needs.build-apks.result == 'success'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: all-apks
          path: apks
      - uses: actions/download-artifact@v4
        if: needs.build-mods.result == 'success'
        with:
          name: mod-zips
          path: modules
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;35.0.1

      - name: Publish legacy rolling release (do not retire before task 17)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin refs/tags/latest
          notes="Legacy update channel. Wave replaces Updater and Installer; see https://github.com/thooton/wave."
          gh release view latest >/dev/null 2>&1 || gh release create latest --verify-tag --title "Sonim apps (latest)" --notes "$notes"
          gh release edit latest --notes "$notes"
          gh release upload latest apks/*.apk apks/manifest.json apks/versions.txt apks/packages.txt --clobber
          gh release view latest --json assets -q '.assets[].name' | while read -r name; do
            [ -f "apks/$name" ] || gh release delete-asset latest "$name" -y
          done

      - name: Create immutable releases or verify existing ones
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_PUBLISH: ${{ inputs.retry-publish }}
          SKIP_MODS: ${{ needs.build-mods.result != 'success' }}
        run: |
          opts=()
          [[ "$RETRY_PUBLISH" != true ]] || opts+=(--retry-publish)
          [[ "$SKIP_MODS" != true ]] || opts+=(--skip-mods)
          python3 .github/release_all.py --publish-list publish.jsonl \
            --aapt2 "$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/aapt2" "${opts[@]}"

      - name: Check out the catalog
        if: vars.WAVE_PUBLISH_ENABLED == 'true' && hashFiles('publish.jsonl') != ''
        uses: actions/checkout@v4
        with:
          repository: thooton/wave_repository
          token: ${{ secrets.WAVE_REPOSITORY_TOKEN }}
          path: .wavesrc-target
      - name: Check out Wave's publishing tool
        if: vars.WAVE_PUBLISH_ENABLED == 'true' && hashFiles('publish.jsonl') != ''
        uses: actions/checkout@v4
        with:
          repository: thooton/wave
          ref: v1
          path: .wave-tools
          sparse-checkout: |
            tools/wavesrc
            spec
      - name: Mirror new releases into the catalog
        if: vars.WAVE_PUBLISH_ENABLED == 'true' && hashFiles('publish.jsonl') != ''
        run: |
          .github/publish_all.sh .wavesrc-target .wave-tools/tools/wavesrc/wavesrc publish.jsonl \
            "$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/aapt2"
      - name: Flag releases that are not yet in the catalog
        if: vars.WAVE_PUBLISH_ENABLED != 'true' && hashFiles('publish.jsonl') != ''
        run: |
          [[ -s publish.jsonl ]] || exit 0
          names=$(python3 -c 'import json; print(", ".join(json.loads(l)["name"] for l in open("publish.jsonl")))')
          msg="Released $names, but CI did not publish them: WAVE_PUBLISH_ENABLED is off. Mirror them into thooton/wave_repository with Wave's wavesrc publish, then run Wave's tools/ship/ship check."
          echo "::warning title=Not published to the catalog::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if any package failed to release
        if: steps.release.outcome != 'success'
        run: |
          echo "::error::Some packages were not released; see the job summary and the release step's log."
          exit 1
