name: Build and publish XP3800 packages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      retry-publish:
        type: boolean
        description: Retry mirroring unchanged packages from their existing releases
        default: false

permissions:
  contents: read

concurrency:
  group: wave-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_BUILD_TOOLS: '35.0.1'

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      apks: ${{ steps.inventory.outputs.apks }}
      mods: ${{ steps.inventory.outputs.mods }}
    steps:
      - uses: actions/checkout@v4
      - id: inventory
        run: |
          python3 -m unittest discover -s .github -p 'test_release.py'
          echo "apks=$(python3 .github/packages.py matrix apk)" >> "$GITHUB_OUTPUT"
          echo "mods=$(python3 .github/packages.py matrix mod)" >> "$GITHUB_OUTPUT"

  build-apks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.1
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APKs and legacy manifest with the checked-in keys
        run: .github/build-apks.sh
      - uses: actions/upload-artifact@v4
        with:
          name: all-apks
          path: apks/
          if-no-files-found: error

  release-apks:
    needs: [inventory, build-apks]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.inventory.outputs.apks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: all-apks
          path: apks
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;35.0.1
      - id: release
        name: Create immutable release or verify existing release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_PATH: ${{ matrix.package.path }}
          RETRY_PUBLISH: ${{ inputs.retry-publish }}
        run: |
          asset="$PACKAGE_PATH.apk"
          retry=(); [[ "$RETRY_PUBLISH" != true ]] || retry+=(--retry-publish)
          python3 .github/release_package.py "$PACKAGE_PATH" "apks/$asset" \
            --aapt2 "$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/aapt2" "${retry[@]}"
      - uses: thooton/wave/publish@v1
        if: steps.release.outputs.binary != '' && vars.WAVE_PUBLISH_ENABLED == 'true'
        with:
          source-repository: thooton/wave_repository
          source-token: ${{ secrets.WAVE_REPOSITORY_TOKEN }}
          section: ${{ matrix.package.section }}
          folder: ${{ matrix.package.name }}
          meta: ${{ matrix.package.path }}/wave/package.json
          icon: ${{ matrix.package.path }}/wave/icon.png
          binary: ${{ steps.release.outputs.binary }}
          url: ${{ steps.release.outputs.url }}
          changes-path: ${{ matrix.package.path }}
      - name: Flag a release that is not yet in the catalog
        if: steps.release.outputs.binary != '' && vars.WAVE_PUBLISH_ENABLED != 'true'
        env:
          BINARY: ${{ steps.release.outputs.binary }}
        run: |
          msg="Released ${BINARY##*/}, but CI did not publish it: WAVE_PUBLISH_ENABLED is off. Mirror it into thooton/wave_repository with Wave's wavesrc publish, then run Wave's tools/ship/ship check."
          echo "::warning title=Not published to the catalog::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  mods:
    needs: inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.inventory.outputs.mods) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.1
      - name: Host tests and module package
        env:
          PACKAGE_PATH: ${{ matrix.package.path }}
        run: |
          mods/tools/setup.sh
          mods/tools/test.sh
          "$PACKAGE_PATH/tools/test.sh"
          # What mods/tools/build-module.sh does, for every mod.
          "$PACKAGE_PATH/tools/build.sh"
          "$PACKAGE_PATH/tools/package.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package.name }}-module
          path: ${{ matrix.package.path }}/out/*.zip
          if-no-files-found: error

  release-mods:
    needs: [inventory, mods]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.inventory.outputs.mods) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.package.name }}-module
          path: module
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_PATH: ${{ matrix.package.path }}
          RETRY_PUBLISH: ${{ inputs.retry-publish }}
        run: |
          zip=$(find module -maxdepth 1 -name '*.zip' -print -quit)
          retry=(); [[ "$RETRY_PUBLISH" != true ]] || retry+=(--retry-publish)
          python3 .github/release_package.py "$PACKAGE_PATH" "$zip" "${retry[@]}"
      - uses: thooton/wave/publish@v1
        if: steps.release.outputs.binary != '' && vars.WAVE_PUBLISH_ENABLED == 'true'
        with:
          source-repository: thooton/wave_repository
          source-token: ${{ secrets.WAVE_REPOSITORY_TOKEN }}
          section: ${{ matrix.package.section }}
          folder: ${{ matrix.package.name }}
          meta: ${{ matrix.package.path }}/wave/package.json
          icon: ${{ matrix.package.path }}/wave/icon.png
          binary: ${{ steps.release.outputs.binary }}
          url: ${{ steps.release.outputs.url }}
          changes-path: ${{ matrix.package.path }}
      - name: Flag a release that is not yet in the catalog
        if: steps.release.outputs.binary != '' && vars.WAVE_PUBLISH_ENABLED != 'true'
        env:
          BINARY: ${{ steps.release.outputs.binary }}
        run: |
          msg="Released ${BINARY##*/}, but CI did not publish it: WAVE_PUBLISH_ENABLED is off. Mirror it into thooton/wave_repository with Wave's wavesrc publish, then run Wave's tools/ship/ship check."
          echo "::warning title=Not published to the catalog::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  legacy-latest:
    needs: build-apks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: all-apks
          path: apks
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;35.0.1
      - name: Publish legacy rolling release (do not retire before task 17)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin refs/tags/latest
          notes="Legacy update channel. Wave replaces Updater and Installer; see https://github.com/thooton/wave."
          gh release view latest >/dev/null 2>&1 || gh release create latest --verify-tag --title "Sonim apps (latest)" --notes "$notes"
          gh release edit latest --notes "$notes"
          gh release upload latest apks/*.apk apks/manifest.json apks/versions.txt apks/packages.txt --clobber
          gh release view latest --json assets -q '.assets[].name' | while read -r name; do
            [ -f "apks/$name" ] || gh release delete-asset latest "$name" -y
          done
