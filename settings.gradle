pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "sonim"

// Every active app, and the shared code, is one build. A directory's `app`, `core`
// and `ui` modules are found at <dir>/android/<module> or <dir>/<module>, and
// included as :<dir>:<module>, so a new app needs no line here.
// Keep retired source in place without configuring or building its projects.
def retired = file("gradle/retired-apps.txt").readLines()
    .collect { it.trim() }.findAll { it && !it.startsWith("#") } as Set
rootDir.listFiles().findAll { !retired.contains(it.name) }.sort().each { dir ->
    ["app", "core", "ui"].each { module ->
        def found = [new File(dir, "android/$module"), new File(dir, module)].find {
            new File(it, "build.gradle").isFile()
        }
        if (found) {
            include ":${dir.name}:$module"
            project(":${dir.name}:$module").projectDir = found
        }
    }
}
